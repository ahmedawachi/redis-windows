name: Build Redis

# Reusable release pipeline: patch check, wrapper tests (Windows unit, Linux real-server)
# and publish, MSYS2 and Cygwin builds with smoke tests, the wrapper integration test on
# both packages, then a GitHub release tagged
# <redis_version>-<FORK_LABEL>.<fork_revision>.

on:
  workflow_call:
    inputs:
      redis_version:
        description: "Upstream Redis tag, e.g. 8.10.2"
        required: true
        type: string
      fork_revision:
        description: "Revision of this fork's build for that Redis version"
        required: false
        type: number
        default: 1
      optimization:
        description: "make OPTIMIZATION= value (-O2 default; -O0 is the fallback)"
        required: false
        type: string
        default: "-O2"
      build_tls:
        required: false
        type: boolean
        default: true
      make_latest:
        required: false
        type: boolean
        default: false
      prerelease:
        required: false
        type: boolean
        default: true
    outputs:
      release_tag:
        description: "The tag of the release"
        value: ${{ jobs.prepare.outputs.release_tag }}

permissions:
  contents: read

env:
  # Names this build everywhere: tag, package names, release title and start-up banner.
  FORK_LABEL: fork

jobs:
  patches:
    uses: ./.github/workflows/patch-check.yml
    with:
      redis_version: ${{ inputs.redis_version }}

  prepare:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.names.outputs.release_tag }}
      dist_base: ${{ steps.names.outputs.dist_base }}
      fork_label: ${{ steps.names.outputs.fork_label }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs and name the release
        id: names
        shell: pwsh
        env:
          REDIS_VERSION: ${{ inputs.redis_version }}
          FORK_REVISION: ${{ inputs.fork_revision }}
          OPTIMIZATION: ${{ inputs.optimization }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REDIS_VERSION -notmatch '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9.]+)?$') { throw "Invalid redis_version '$env:REDIS_VERSION'" }
          if ($env:FORK_REVISION -notmatch '^[1-9][0-9]*$') { throw "fork_revision must be a positive integer, got '$env:FORK_REVISION'" }
          if ($env:OPTIMIZATION -notmatch '^-O[0-3sg]$') { throw "optimization must be one of -O0 -O1 -O2 -O3 -Os -Og, got '$env:OPTIMIZATION'" }
          if ($env:FORK_LABEL -notmatch '^[A-Za-z0-9._-]+$') { throw "FORK_LABEL may only contain A-Z a-z 0-9 . _ -" }
          $tag = "$env:REDIS_VERSION-$env:FORK_LABEL.$env:FORK_REVISION"
          "release_tag=$tag" | Out-File -Append $env:GITHUB_OUTPUT
          "dist_base=Redis-$tag-Windows-x64" | Out-File -Append $env:GITHUB_OUTPUT
          "fork_label=$env:FORK_LABEL" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Output "Release tag: $tag"

      - name: Download the upstream source and release notes
        shell: pwsh
        env:
          REDIS_VERSION: ${{ inputs.redis_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:REDIS_VERSION
          Invoke-WebRequest -Uri "https://github.com/redis/redis/archive/refs/tags/$v.tar.gz" -OutFile "redis-$v.tar.gz"
          try {
            $release = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -Uri "https://api.github.com/repos/redis/redis/releases/tags/$v"
            $body = $release.body -replace '(?<![\w/])#(\d+)', 'https://github.com/redis/redis/pull/$1'
          } catch {
            $body = $null
          }
          if ([string]::IsNullOrWhiteSpace($body)) {
            $body = "Upstream release notes: https://github.com/redis/redis/releases/tag/$v"
          }
          $body | Set-Content -Encoding utf8 redis_release_notes.md

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Wrapper unit tests
        shell: pwsh
        run: dotnet run --project tests/RedisService.Tests -c Release

      - name: Publish RedisService.exe
        shell: pwsh
        run: dotnet publish RedisService.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Upload source and RedisService.exe
        uses: actions/upload-artifact@v4
        with:
          name: redis-source
          if-no-files-found: error
          path: |
            redis-${{ inputs.redis_version }}.tar.gz
            redis_release_notes.md
            publish

  build:
    needs: [patches, prepare]
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msys2, cygwin]
    uses: ./.github/workflows/build-windows.yml
    with:
      toolchain: ${{ matrix.toolchain }}
      redis_version: ${{ inputs.redis_version }}
      dist_name: ${{ needs.prepare.outputs.dist_base }}-${{ matrix.toolchain }}
      artifact_name: redis-${{ matrix.toolchain }}-builds
      fork_label: ${{ needs.prepare.outputs.fork_label }}
      optimization: ${{ inputs.optimization }}
      build_tls: ${{ inputs.build_tls }}
      apply_patches: true
      smoke_fork_features: series
      with_service: true

  wrapper-integration:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        # Both -with-Service packages ship, and the wrapper resolves its runtime per
        # package (msys-2.0.dll vs cygwin1.dll), so both are run as a real service.
        toolchain: [msys2, cygwin]
    uses: ./.github/workflows/wrapper-integration.yml
    with:
      artifact_name: redis-${{ matrix.toolchain }}-builds
      dist_name: ${{ needs.prepare.outputs.dist_base }}-${{ matrix.toolchain }}

  # The real-server wrapper tests skip on Windows; run them on Linux against the patched tree.
  wrapper-unit-linux:
    needs: patches
    uses: ./.github/workflows/wrapper-unit-linux.yml
    with:
      redis_version: ${{ inputs.redis_version }}

  release:
    needs: [prepare, build, wrapper-integration, wrapper-unit-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.release_tag }}
      DIST_BASE: ${{ needs.prepare.outputs.dist_base }}
      REDIS_VERSION: ${{ inputs.redis_version }}
      OPTIMIZATION: ${{ inputs.optimization }}
      BUILD_TLS: ${{ inputs.build_tls }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare the release body
        run: |
          set -euo pipefail
          {
            echo "Redis $REDIS_VERSION for Windows, $FORK_LABEL build \`$TAG\`: upstream Redis with this repository's patch series, built with MSYS2 and Cygwin at \`OPTIMIZATION=$OPTIMIZATION\`, TLS: $BUILD_TLS."
            echo
            echo "- \`*-msys2*.zip\` / \`*-cygwin*.zip\`: stripped binaries. \`*-with-Service.zip\` adds RedisService.exe."
            echo "- \`*-debug.zip\`: the same binaries unstripped, for post-mortem debugging."
            echo
            echo "## Upstream release notes"
            echo
            cat redis-source/redis_release_notes.md
            echo
            for tc in msys2 cygwin; do
              echo "## Build information ($tc)"
              echo
              echo '```text'
              cat "redis-$tc-builds/$DIST_BASE-$tc-build-info.txt"
              echo '```'
              echo
            done
            echo "## SHA256"
            echo
            echo '```text'
            cat redis-msys2-builds/hashes-*.txt redis-cygwin-builds/hashes-*.txt
            echo '```'
            echo
            echo "From workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >release_body.md
          wc -c release_body.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          name: Redis ${{ inputs.redis_version }} for Windows (${{ needs.prepare.outputs.release_tag }})
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: release_body.md
          make_latest: ${{ inputs.make_latest && 'true' || 'false' }}
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            redis-msys2-builds/${{ needs.prepare.outputs.dist_base }}-msys2.zip
            redis-msys2-builds/${{ needs.prepare.outputs.dist_base }}-msys2-with-Service.zip
            redis-msys2-builds/${{ needs.prepare.outputs.dist_base }}-msys2-debug.zip
            redis-cygwin-builds/${{ needs.prepare.outputs.dist_base }}-cygwin.zip
            redis-cygwin-builds/${{ needs.prepare.outputs.dist_base }}-cygwin-with-Service.zip
            redis-cygwin-builds/${{ needs.prepare.outputs.dist_base }}-cygwin-debug.zip
            redis-msys2-builds/hashes-${{ needs.prepare.outputs.dist_base }}-msys2.txt
            redis-cygwin-builds/hashes-${{ needs.prepare.outputs.dist_base }}-cygwin.txt
