name: Cron Build Redis

# Daily check for a new upstream Redis release. A new tag is recorded in
# .github/redis_latest_version.txt (a commit the owner sees) and built with this
# repository's patch series as a PRERELEASE. It is never marked as the latest release:
# promoting a build is a manual decision (manual-redis.yml or the release page).

on:
  schedule:
    - cron: '0 1 * * *'  # every day at 01:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-new-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      new_version_found: ${{ steps.check.outputs.new_version_found }}
      redis_version: ${{ steps.check.outputs.redis_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new Redis release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=.github/redis_latest_version.txt
          current=$(tr -d '\r\n' <"$file" 2>/dev/null || true)
          latest=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/redis/redis/releases/latest | jq -r .tag_name)
          case "$latest" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::Unexpected upstream tag '$latest'"; exit 1 ;;
          esac
          case "$latest" in *[!A-Za-z0-9._-]*) echo "::error::Unexpected upstream tag '$latest'"; exit 1 ;; esac
          if [ "$latest" = "$current" ]; then
            echo "No new version found. Current: $current"
            echo "new_version_found=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "New version found: $latest (current: $current)"
          echo "new_version_found=true" >>"$GITHUB_OUTPUT"
          echo "redis_version=$latest" >>"$GITHUB_OUTPUT"
          printf '%s' "$latest" >"$file"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$file"
          git commit -m "update redis latest version to $latest"
          git push

  build-redis:
    needs: check-new-version
    if: needs.check-new-version.outputs.new_version_found == 'true'
    uses: ./.github/workflows/build-redis.yml
    with:
      redis_version: ${{ needs.check-new-version.outputs.redis_version }}
      fork_revision: 1
      optimization: "-O2"
      build_tls: true
      prerelease: true
      make_latest: false

  report:
    needs: [check-new-version, build-redis]
    if: always() && needs.check-new-version.outputs.new_version_found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REDIS_VERSION: ${{ needs.check-new-version.outputs.redis_version }}
      RESULT: ${{ needs.build-redis.result }}
    steps:
      - name: Summarize
        run: |
          set -euo pipefail
          if [ "$RESULT" = success ]; then
            echo "New upstream Redis $REDIS_VERSION: built with the patch series and published as a **prerelease** (not marked latest)." >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo "New upstream Redis $REDIS_VERSION: the prerelease build **$RESULT**."
              echo
              echo "If the patch series does not apply, the \"Patches on Redis $REDIS_VERSION\" job summary above names the rejected patch."
              echo "Rebase patches/redis/ onto $REDIS_VERSION, then run \"Manual Build Redis\"."
            } >>"$GITHUB_STEP_SUMMARY"
            echo "::error::Prerelease build of Redis $REDIS_VERSION: $RESULT"
            exit 1
          fi
