name: Manual Build Redis

on:
  workflow_dispatch:
    inputs:
      redis_version:
        description: 'Upstream Redis version (tag)'
        required: true
        default: "8.10.2"
        type: string
      fork_revision:
        description: 'Fork revision: the release is tagged <version>-fork.<revision>'
        required: true
        default: 1
        type: number
      optimization:
        description: 'Optimization level (make OPTIMIZATION=); -O0 is the fallback'
        required: true
        default: "-O2"
        type: choice
        options: ["-O2", "-O0", "-O1", "-O3", "-Os"]
      build_tls:
        description: 'Build with TLS support'
        default: true
        type: boolean
      make_latest:
        description: 'Mark as Latest Release'
        default: false
        type: boolean
      prerelease:
        description: 'Mark as Pre-release'
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-redis:
    uses: ./.github/workflows/build-redis.yml
    # A run started through the REST API delivers every input as a string ("1", "true"), which the
    # reusable workflow's number/boolean inputs reject. These forms accept the string and the typed value.
    with:
      redis_version: ${{ inputs.redis_version }}
      fork_revision: ${{ fromJSON(format('{0}', inputs.fork_revision)) }}
      optimization: ${{ inputs.optimization }}
      build_tls: ${{ inputs.build_tls == true || inputs.build_tls == 'true' }}
      make_latest: ${{ inputs.make_latest == true || inputs.make_latest == 'true' }}
      prerelease: ${{ inputs.prerelease == true || inputs.prerelease == 'true' }}
