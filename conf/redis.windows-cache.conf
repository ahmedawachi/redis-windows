# redis.windows-cache.conf
#
# Recommended configuration for a PURE CACHE workload (for example an ASP.NET
# Core IDistributedCache) running this fork's MSYS2 or Cygwin build on Windows
# Server, under RedisService.exe.
#
# "Pure cache" means: every key can be rebuilt from the system of record, the
# application already tolerates cache misses, and there are no replicas.
# If Redis holds data you cannot rebuild, do NOT use this file as-is: read the
# persistence section and docs/OPERATIONS.md first.
#
# Every active directive below exists in stock Redis 8.10.2 (checked against
# src/config.c), so this file loads on a stock build and on the current fork
# build alike. The one line marked FORK-ONLY is commented out because the
# fork's Windows builds already default to it; see the note next to it.
#
# Paths: use absolute, Windows-style paths with FORWARD slashes (C:/Redis/...).
# The Cygwin/MSYS2 runtime accepts them directly, which bypasses its mount
# table (/cygdrive, /bin, fstab). Relative paths resolve against the service's
# working directory, which is not the install folder. Inside double quotes a
# backslash is an escape character, so "C:\Redis" does NOT mean what it looks
# like - use "C:/Redis" instead.
#
# RedisService.exe command-line options (--port, --dir, --loglevel) override
# the values in this file.
#
# Units: 1k = 1000 bytes, 1kb = 1024 bytes, 1m = 1000000, 1mb = 1048576 bytes,
# 1g = 1000000000, 1gb = 1073741824 bytes. Units are case-insensitive.

################################## NETWORK ###################################

# Listen on loopback only. The application must run on the same host.
# If a remote client genuinely needs access, bind a specific interface address,
# keep requirepass, and restrict the port with Windows Firewall - never 0.0.0.0
# without a firewall rule.
bind 127.0.0.1

# Refuse clients from non-loopback addresses while no password is configured.
# Keep this on even with requirepass set: it is a second line of defence
# against a config edit that accidentally removes the password.
protected-mode yes

port 6379

# Close idle client connections after N seconds (0 = never). Connection-pooling
# clients such as StackExchange.Redis keep long-lived connections; leave at 0.
timeout 0

# TCP keepalive probes for dead peers, in seconds (default 300).
tcp-keepalive 300

################################# GENERAL ####################################

# Never daemonize under RedisService.exe: the wrapper supervises the process
# and must see it exit.
daemonize no

# No pidfile. The wrapper tracks the process itself, and a pidfile left behind
# by a hard kill only confuses the next start.
# pidfile ./redis_6379.pid

loglevel notice

# ALWAYS use an explicit log file. With logfile "" (the stock redis.conf
# default) Redis logs to stdout, and under the service that output - including
# the crash report you need after an out-of-memory abort - is lost.
# The folder must exist and the service account needs Modify rights on it.
# Redis re-opens the file for every line, so it is safe to rotate it from
# outside (rename or truncate); see docs/OPERATIONS.md "Log rotation".
logfile "C:/Redis/logs/redis.log"

databases 16

always-show-logo no

# Write a crash report (stack trace, INFO, client list) to the log when Redis
# dies on a signal or a panic. This is the default; it is repeated here because
# the report is the most important evidence after a crash.
crash-log-enabled yes

# Optional: hide key names and values from the crash report and other log
# lines. Useful if cached values are sensitive; costs some diagnostic detail.
# hide-user-data-from-log yes

############################### PERSISTENCE ##################################

# Disable RDB snapshots entirely.
#
# On Cygwin/MSYS2 every BGSAVE is a full process copy, not copy-on-write: the
# main thread stalls for the whole fork (hundreds of milliseconds, sometimes
# more than a second) and the system commit charge for Redis roughly DOUBLES
# for the lifetime of the child. On a host that is short of commit, that is
# exactly when a large allocation fails. With no save points and no AOF,
# Redis never forks.
#
# Trade-off: every restart (crash, patching reboot, planned restart) starts
# with an empty cache, and the first requests go to the system of record -
# PROVIDED NO dump.rdb IS LEFT IN "dir". Redis always loads an existing RDB
# file at startup, whatever "save" says. With save "" that file is never
# rewritten, so an old snapshot would be reloaded, frozen, on every restart
# (including every crash restart by the wrapper), and keys without a TTL
# would come back with stale values indefinitely. When you switch an existing
# instance to this profile: stop the service, then delete or rename
# <dir>\dump.rdb and any <dir>\temp-*.rdb before starting it again.
#
# Alternative if a warm start matters: replace the line below with
#
#     save 3600 1
#
# which snapshots at most once an hour (at most 24 forks a day) as long as at
# least one key changed. Make sure no other "save" line remains - the stock
# redis.conf ships several and a later line would add more save points. If you
# keep a save point, also read "stop-writes-on-bgsave-error" below and plan
# for a manual authenticated SAVE before a planned stop.
#
# Note: omitting "save" altogether does NOT disable snapshots - Redis then uses
# its built-in defaults (3600 1 300 100 60 10000). Use save "" explicitly.
save ""

# If a background save fails (for example because the fork itself failed),
# keep accepting writes instead of answering every write with a MISCONF error.
# Only relevant when a save point is configured, but harmless otherwise.
stop-writes-on-bgsave-error no

# Written by manual SAVE/BGSAVE or by "save" points, and LOADED at every
# startup if it exists (see the note above). Lives in "dir" below.
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes

# Working directory: RDB files, and the base for any relative path. Use an
# absolute path. RedisService.exe --dir overrides this value.
dir "C:/Redis/data"

# No append-only file. Without periodic rewrites an AOF grows without bound,
# and every rewrite forks - the same cost as BGSAVE.
appendonly no

################################# SECURITY ###################################

# Require a password. REPLACE THE PLACEHOLDER before first start with a long
# random secret, for example generated in PowerShell with:
#
#   $b = New-Object byte[] 32
#   [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b)
#   [Convert]::ToBase64String($b)
#
# (Avoid characters that need quoting: use the base64 output as-is, or remove
# "+" "/" "=" if your client connection string cannot carry them.)
# The same value goes into the application's connection string.
#
# This file then contains a secret: restrict its ACL so that only
# Administrators, SYSTEM and the service account can read it. See
# docs/OPERATIONS.md "Protect the config file".
requirepass REPLACE_WITH_A_LONG_RANDOM_SECRET

# The DEBUG command must stay disabled in production. This fork adds test-only
# DEBUG subcommands (fault injection); they are reachable only when this is
# "yes" or "local". CI and test environments may enable it, production never.
enable-debug-command no

# Keep CONFIG SET from changing protected settings such as dir and dbfilename
# at run time (a classic file-write escalation). Default "no"; stated here so
# the intent is explicit.
enable-protected-configs no

# No modules are loaded or needed for a cache. Default "no".
enable-module-command no

################################### CLIENTS ##################################

# Maximum number of simultaneous client connections.
#
# The Cygwin/MSYS2 build uses the select() event loop, whose fd_set holds
# FD_SETSIZE = 1024 descriptors. Redis sizes its event loop as maxclients + 128,
# and a stock build does not check that against FD_SETSIZE: once any
# descriptor >= 1024 exists, it overwrites heap memory or panics. Therefore:
#
#   - stock builds: keep maxclients at 895 or lower;
#   - this fork: patch 0002 clamps maxclients to 895 (FD_SETSIZE - 129) on
#     select builds and logs a warning, so a larger value is reduced at
#     startup instead of corrupting memory. 895 is exactly the limit, so no
#     warning is logged.
#
# A connection-pooling application needs only a handful of connections per
# process; if you see anywhere near this many, look for a connection leak.
maxclients 895

############################## MEMORY MANAGEMENT #############################

# Upper bound for the dataset. Size it from the host's COMMIT headroom, not
# from RAM alone:
#
#   - Windows commit limit = RAM + pagefile. Every process on the host draws
#     from it; when it is exhausted, allocations fail in whichever process asks
#     next - including Redis, even when its own dataset is small.
#   - Redis's real footprint is larger than used_memory: client buffers,
#     allocator overhead and runtime DLLs sit on top. Allow at least
#     1.5 x maxmemory of commit for Redis, and 2 x (plus the dataset again)
#     if you keep a "save" point, because every fork copies the whole heap.
#   - Watch "Private Bytes" of redis-server in PerfMon (or the fork's
#     process_private_bytes INFO field) to learn the real ratio on your host.
#
# Example: a 256 MB cache on a host with a few GB of commit headroom.
maxmemory 256mb

# Evict the least recently used keys, across ALL keys, when maxmemory is
# reached. This is the right policy for a cache in which every key can be
# rebuilt. (volatile-lru would evict only keys that have a TTL and return OOM
# errors when none are left; noeviction is the default and wrong for a cache.)
maxmemory-policy allkeys-lru

# LRU sampling precision. 5 (default) is a good balance; 10 is closer to true
# LRU at slightly more CPU.
maxmemory-samples 5

# Soft out-of-memory handling for client buffers - FORK-ONLY directive
# (patch 0007, roadmap T2-1). When the Windows commit for a large query or
# reply buffer is refused, only that client is closed and counted in INFO stats
# "client_oom_disconnections", instead of the whole server aborting.
# Allocations for the dataset itself stay fatal.
#
# The fork's MSYS2/Cygwin builds already default to "yes", so the line is left
# commented out: that keeps this file loadable on a stock build, which rejects
# the directive with "Unresolved Configuration(s) Detected: >>>
# 'oom-soft-client-buffers yes'" and exits with code 1 (under the fork's
# wrapper, a crash loop). Uncomment it only on a fork build, to make the
# setting explicit; check first that "redis-cli CONFIG GET
# oom-soft-client-buffers" returns a value.
# oom-soft-client-buffers yes

############################### THREADED I/O #################################

# Keep single-threaded I/O. The runtime's malloc sits behind one global lock,
# so extra I/O threads contend instead of scaling, and the workload is far too
# small to benefit.
io-threads 1

############################ ADVANCED / MONITORING ###########################

# Background task frequency. 10 is the default and correct here; raising it
# only burns CPU on this platform.
hz 10
dynamic-hz yes

# Record events (fork, slow commands, eviction cycles, ...) that take 100 ms or
# more. Off by default; turning it on makes LATENCY LATEST / LATENCY HISTORY
# useful after an incident.
latency-monitor-threshold 100

# Slow log: commands slower than 10 ms (value in microseconds), keep 128.
slowlog-log-slower-than 10000
slowlog-max-len 128
